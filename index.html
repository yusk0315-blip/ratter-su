<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ラットレース脱出カウンター</title>
  <meta name="theme-color" content="#111827">
  <style>
    :root{
      --bg:#f3f4f6; --text:#111827; --muted:#6b7280;
      --line:#e5e7eb; --accent:#111827;
    }
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:760px;margin:0 auto;padding:16px 12px 98px;}
    .title{font-size:22px;font-weight:900;margin:10px 4px 6px;}
    .sub{color:var(--muted);margin:0 4px 14px;line-height:1.5;}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.06);margin:12px 0;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:560px){.grid{grid-template-columns:1fr;}}
    label{font-size:12px;color:var(--muted);display:block;margin:2px 0 6px;}
    input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:12px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
    button{padding:12px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;}
    .btn{background:var(--accent);color:#fff;border:none;flex:1;min-width:150px;}
    .btn2{background:#fff;border:1px solid var(--line);flex:1;min-width:150px;}
    .kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;}
    @media(max-width:560px){.kpi{grid-template-columns:1fr;}}
    .box{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;}
    .h{font-size:12px;color:var(--muted);}
    .v{font-size:22px;font-weight:900;margin:4px 0;}
    .tag{font-size:12px;color:var(--muted);line-height:1.45;}
    .msg{margin-top:10px;line-height:1.65;}
    .note{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed #d1d5db;background:#fafafa;font-size:13px;line-height:1.7;}
    .footer{position:fixed;bottom:0;left:0;right:0;background:rgba(243,244,246,.92);border-top:1px solid var(--line);padding:10px;}
    .footer .inner{max-width:760px;margin:0 auto;display:flex;gap:10px;}
    a{color:#111827;font-weight:900;}
    .small{font-size:13px;color:var(--muted);line-height:1.6;}
    .debug{margin-top:10px;font-size:12px;color:#b91c1c;white-space:pre-wrap;}
  </style>
</head>
<body>

<div class="wrap">
  <div class="title">ラットレース脱出カウンター</div>
  <p class="sub">あと何年、今の働き方を続ける？数字で現実を見る。</p>

  <div class="card">
    <div class="grid">
      <div>
        <label>現在の資産（円）</label>
        <input id="current" type="number" inputmode="numeric" value="2000000">
      </div>
      <div>
        <label>目標資産（円）</label>
        <input id="target" type="number" inputmode="numeric" value="30000000">
      </div>
      <div>
        <label>毎月の投資額（円）</label>
        <input id="monthly" type="number" inputmode="numeric" value="50000">
      </div>
      <div>
        <label>想定年利（%）</label>
        <input id="rate" type="number" inputmode="decimal" step="0.1" value="5">
      </div>
      <div>
        <label>現在の年齢</label>
        <input id="age" type="number" inputmode="numeric" value="32">
      </div>
      <div>
        <label>月の生活費（円）</label>
        <input id="expense" type="number" inputmode="numeric" value="250000">
      </div>
    </div>

    <div class="row">
      <button class="btn" onclick="calc()">計算する</button>
      <button class="btn2" onclick="toggleTax()">税引前 / 後 切替</button>
    </div>

    <div class="kpi" id="kpi" style="display:none;">
      <div class="box">
        <div class="h">経済的自立まで</div>
        <div class="v" id="yearsOut">—</div>
        <div class="tag" id="yearsTag">—</div>
      </div>
      <div class="box">
        <div class="h">到達年齢</div>
        <div class="v" id="ageAtOut">—</div>
        <div class="tag" id="moneyAtOut">—</div>
      </div>
      <div class="box">
        <div class="h">目標資産を4%で回すと</div>
        <div class="v" id="monthly4Out">—</div>
        <div class="tag" id="monthly4Tag">—</div>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="card" style="margin-top:12px;">
      <div style="font-weight:900;margin-bottom:6px;">副業で「到達まで」がどれだけ縮む？</div>
      <div class="small">※毎月の投資額に上乗せした場合（+1万 / +3万 / +5万）</div>

      <div class="kpi" style="margin-top:10px;">
        <div class="box">
          <div class="h">副業 +¥10,000/月</div>
          <div class="v" id="s10_short">—</div>
          <div class="tag" id="s10_detail">—</div>
        </div>
        <div class="box">
          <div class="h">副業 +¥30,000/月</div>
          <div class="v" id="s30_short">—</div>
          <div class="tag" id="s30_detail">—</div>
        </div>
        <div class="box">
          <div class="h">副業 +¥50,000/月</div>
          <div class="v" id="s50_short">—</div>
          <div class="tag" id="s50_detail">—</div>
        </div>
      </div>
    </div>

    <div class="note">
      ✅ 有料noteで「ラットレースを抜け出す」ための現実ルートを公開中。<br>
      キーワードは <b>副業で資産を加速</b>。<br><br>
      ▶ <a href="https://note.com/yusuke_record/n/n02f4a93ae57f" target="_blank" rel="noopener">
      副業で資産を加速させる具体策（ゆーすけ）</a>
    </div>

    <div class="debug" id="debug"></div>
  </div>
</div>

<div class="footer">
  <div class="inner">
    <button class="btn" onclick="copyResult()">結果をコピー</button>
  </div>
</div>

<script>
  // ===== デバッグ表示 =====
  const debugEl = document.getElementById("debug");
  window.onerror = function(msg, url, line, col, err){
    debugEl.textContent = "JSエラー:\n" + msg + "\nline:" + line + " col:" + col;
  };

  // ===== 設定 =====
  let taxMode = "before"; // before / after
  const taxRate = 0.20315;

  // ===== util =====
  function num(v){ return Number(String(v ?? "").replace(/,/g,"")) || 0; }
  function yen(n){ return Math.round(n).toLocaleString("ja-JP"); }

  function monthsToTarget(current, target, monthly, ratePct){
    if(target <= 0) return {months:-1, asset:current};
    if(current >= target) return {months:0, asset:current};

    const r = (ratePct/100)/12;
    let asset = current;

    for(let i=1;i<=600;i++){
      asset = asset * (1 + r) + monthly;
      if(asset >= target) return {months:i, asset};
    }
    return {months:-1, asset};
  }

  function formatYM(months){
    if(months === -1) return "50年+";
    const y = Math.floor(months/12);
    const m = months % 12;
    if(y === 0 && m === 0) return "0ヶ月";
    return (y ? y + "年" : "") + (m ? m + "ヶ月" : "");
  }

  function diffYM(baseMonths, newMonths){
    if(baseMonths === -1 || newMonths === -1) return null;
    const diff = baseMonths - newMonths;
    if(diff <= 0) return "0ヶ月";
    const y = Math.floor(diff/12);
    const m = diff % 12;
    return (y ? y + "年" : "") + (m ? m + "ヶ月" : "");
  }

  // ===== UI操作 =====
  function toggleTax(){
    taxMode = (taxMode === "before") ? "after" : "before";
    calc();
  }

  function calc(){
    try{
      debugEl.textContent = "";

      const current = num(document.getElementById("current").value);
      const target  = num(document.getElementById("target").value);
      const monthly = num(document.getElementById("monthly").value);
      const ratePct = num(document.getElementById("rate").value);
      const age     = num(document.getElementById("age").value);

      if(target <= 0){ alert("目標資産は1円以上で入れてね"); return; }
      if(current < 0 || monthly < 0 || ratePct < 0 || age < 0){ alert("マイナスは入れないでね"); return; }

      const base = monthsToTarget(current, target, monthly, ratePct);

      // 4%配当（税引前/後）
      const grossAnnual = target * 0.04;
      const netAnnual   = grossAnnual * (1 - taxRate);
      const monthlyIncome = (taxMode === "before") ? (grossAnnual/12) : (netAnnual/12);

      // KPI表示
      document.getElementById("kpi").style.display = "grid";

      const yearsOut = document.getElementById("yearsOut");
      const yearsTag = document.getElementById("yearsTag");
      const ageAtOut = document.getElementById("ageAtOut");
      const moneyAtOut = document.getElementById("moneyAtOut");
      const monthly4Out = document.getElementById("monthly4Out");
      const monthly4Tag = document.getElementById("monthly4Tag");
      const msgEl = document.getElementById("msg");

      monthly4Out.textContent = "¥" + yen(monthlyIncome) + "/月";
      monthly4Tag.textContent = (taxMode === "before")
        ? "税引前（年 ¥" + yen(grossAnnual) + "）"
        : "税引後（年 ¥" + yen(netAnnual) + "）";

      if(base.months === -1){
        yearsOut.textContent = "50年+";
        ageAtOut.textContent = (age + 50) + "歳+";
        moneyAtOut.textContent = "この条件だと到達が遠いかも";
        yearsTag.textContent = "月額UP / 目標調整 / 前提見直し";
        msgEl.innerHTML = "⚠️ 50年以内に目標に届きませんでした。<br>副業で入金力を上げると現実に戻る場合があります（下の比較を見てね）。";
      }else{
        yearsOut.textContent = formatYM(base.months);
        ageAtOut.textContent = (age + base.months/12).toFixed(1) + "歳";
        moneyAtOut.textContent = "到達時資産：¥" + yen(base.asset);

        let tag = "";
        if(base.months <= 60) tag = "かなり現実的（5年以内）";
        else if(base.months <= 120) tag = "現実的（10年以内）";
        else if(base.months <= 240) tag = "長期戦（20年以内）";
        else tag = "超長期（20年以上）";
        yearsTag.textContent = tag;

        msgEl.innerHTML = "✅ このペースなら、目標資産に到達する目安は <b>" + formatYM(base.months) + "</b>。<br>ここからは、<b>副業で資産を加速</b>させて年数を削る。";
      }

      // 副業で短縮
      const boosts = [
        {add: 10000, s:"s10"},
        {add: 30000, s:"s30"},
        {add: 50000, s:"s50"},
      ];

      boosts.forEach(b=>{
        const sim = monthsToTarget(current, target, monthly + b.add, ratePct);
        const shorten = diffYM(base.months, sim.months);

        const shortEl = document.getElementById(b.s + "_short");
        const detailEl = document.getElementById(b.s + "_detail");

        if(base.months === -1 && sim.months !== -1){
          shortEl.textContent = "現実化";
          detailEl.textContent = "到達まで：" + formatYM(sim.months) + "（月+" + yen(b.add) + "）";
        }else if(sim.months === -1){
          shortEl.textContent = "—";
          detailEl.textContent = "まだ届かない（50年+）";
        }else{
          shortEl.textContent = "短縮 " + (shorten ?? "—");
          detailEl.textContent = "到達まで：" + formatYM(sim.months) + "（月+" + yen(b.add) + "）";
        }
      });

      // コピー用
      window.__copyText = [
        "【ラットレース脱出カウンター】",
        "目標資産：¥" + yen(target),
        "現在資産：¥" + yen(current),
        "毎月投資：¥" + yen(monthly),
        "想定年利：" + ratePct + "%",
        "到達まで：" + (base.months===-1 ? "50年+" : formatYM(base.months)),
        "到達年齢：" + ageAtOut.textContent,
        "4%配当：" + monthly4Out.textContent + "（" + (taxMode==="before"?"税引前":"税引後") + "）",
        "",
        "【副業で短縮】",
        "+1万：" + document.getElementById("s10_detail").textContent,
        "+3万：" + document.getElementById("s30_detail").textContent,
        "+5万：" + document.getElementById("s50_detail").textContent,
        "",
        "note：https://note.com/yusuke_record/n/n02f4a93ae57f"
      ].join("\n");

    }catch(e){
      debugEl.textContent = "計算中にエラー:\n" + (e && e.message ? e.message : String(e));
    }
  }

  async function copyResult(){
    const text = window.__copyText || "先に計算してね";
    try{
      await navigator.clipboard.writeText(text);
      alert("コピーしました！");
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      alert("コピーしました！");
    }
  }

  // 入力変更で自動再計算（無反応対策にもなる）
  ["current","target","monthly","rate","age","expense"].forEach(id=>{
    const inp = document.getElementById(id);
    inp.addEventListener("input", ()=>calc());
    inp.addEventListener("change", ()=>calc());
  });

  // 初回
  calc();
</script>

</body>
</html>
